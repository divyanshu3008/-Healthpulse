<!DOCTYPE html>
<html>

<head>
<title>HealthPulse Patient Application</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
margin:0;
padding:40px;
}

.container{
width:1000px;
margin:auto;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0px 10px 30px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#2f6fed;
margin-bottom:30px;
}

.section{
margin-top:35px;
}

.section h2{
border-bottom:2px solid #eee;
padding-bottom:8px;
color:#333;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:15px;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

.buttons{
text-align:center;
margin-top:40px;
}

button{
padding:12px 25px;
border:none;
border-radius:6px;
background:#2f6fed;
color:white;
font-size:16px;
cursor:pointer;
margin:5px;
}

button:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

<div class="container">

<h1>HealthPulse Patient Application Form</h1>

<form action="/register-patient" method="POST">

<!-- Visit Information -->

<div class="section">
<h2>1. Visit Information</h2>
<input type="date" name="visit_date" required>
</div>

<!-- Personal Information -->

<div class="section">
<h2>2. Personal Information</h2>

<div class="grid">

<input type="text" name="name" placeholder="Full Name *" required>

<input type="number" name="age" placeholder="Age *" required>

<select name="gender" required>
<option value="">Gender *</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<select name="blood_group" required>
<option value="">Blood Group *</option>
<option>A+</option>
<option>B+</option>
<option>O+</option>
<option>AB+</option>
</select>

<input type="text" name="phone" placeholder="Phone Number *" required>

<input type="text" name="emergency_contact" placeholder="Emergency Contact *" required>

<select name="marital_status" required>
<option value="">Marital Status *</option>
<option>Single</option>
<option>Married</option>
<option>Divorced</option>
<option>Widowed</option>
</select>

</div>

<input type="text" name="address" placeholder="Address *" required>

</div>

<!-- Physical Details -->

<div class="section">

<h2>3. Physical Details</h2>

<div class="grid">

<input type="number" name="height" placeholder="Height (cm) *" required>

<input type="number" name="weight" placeholder="Weight (kg) *" required>

</div>

</div>

<!-- Department -->

<div class="section">

<h2>4. Disease Department</h2>

<select name="department" required>

<option value="">Select Department *</option>

<option>Cardiology (Heart)</option>
<option>Neurology (Brain/Nerves)</option>
<option>Orthology (Bones)</option>
<option>Pulmonology (Lungs)</option>
<option>Endocrinology (Diabetes)</option>
<option>General Medicine</option>

</select>

</div>

<!-- Symptoms -->

<div class="section">

<h2>5. Current Symptoms</h2>

<input type="text" name="symptoms" placeholder="Enter Symptoms *" required>

</div>

<!-- Health Vitals -->

<div class="section">

<h2>6. Health Vitals</h2>

<div class="grid">

<input type="text" name="bp" placeholder="Blood Pressure (mmHg) *" required>

<input type="text" name="sugar" placeholder="Blood Sugar (mg/dL) *" required>

<input type="text" name="cholesterol" placeholder="Cholesterol (mg/dL) *" required>

<input type="text" name="heart_rate" placeholder="Heart Rate (bpm) *" required>

<input type="text" name="temperature" placeholder="Temperature (°C) *" required>

<input type="text" name="oxygen" placeholder="Oxygen Level (%) *" required>

</div>

</div>

<!-- Lifestyle -->

<div class="section">

<h2>7. Lifestyle Information</h2>

<div class="grid">

<select name="smoking" required>
<option value="">Smoking *</option>
<option>Yes</option>
<option>No</option>
</select>

<select name="alcohol" required>
<option value="">Alcohol *</option>
<option>Yes</option>
<option>No</option>
</select>

<select name="activity" required>
<option value="">Physical Activity *</option>
<option>Low</option>
<option>Moderate</option>
<option>High</option>
</select>

<select name="diet" required>
<option value="">Diet Type *</option>
<option>Vegetarian</option>
<option>Non-Vegetarian</option>
<option>Mixed</option>
</select>

<select name="sleep" required>
<option value="">Sleep Duration *</option>
<option>Less than 5 hours</option>
<option>6-7 hours</option>
<option>8+ hours</option>
</select>

</div>

</div>

<!-- Medical History -->

<div class="section">

<h2>8. Medical History</h2>

<div class="grid">

<select name="diabetes" required>
<option value="">Diabetes *</option>
<option>Yes</option>
<option>No</option>
</select>

<select name="hypertension" required>
<option value="">Hypertension *</option>
<option>Yes</option>
<option>No</option>
</select>

<select name="heart_history" required>
<option value="">Heart Disease History *</option>
<option>Yes</option>
<option>No</option>
</select>

<select name="family_history" required>
<option value="">Family Heart Disease *</option>
<option>Yes</option>
<option>No</option>
</select>

<input type="text" name="surgery" placeholder="Previous Surgery *" required>

<input type="text" name="allergies" placeholder="Allergies *" required>

</div>

<input type="text" name="medication" placeholder="Current Medication *" required>

</div>

<!-- Vaccination -->

<div class="section">

<h2>9. Vaccination Status</h2>

<div class="grid">

<select name="covid_vaccine" required>
<option value="">COVID Vaccine *</option>
<option>Fully</option>
<option>Partially</option>
<option>None</option>
</select>

<select name="hepatitis_vaccine" required>
<option value="">Hepatitis Vaccine *</option>
<option>Fully</option>
<option>Partially</option>
<option>None</option>
</select>

<select name="flu_vaccine" required>
<option value="">Flu Vaccine *</option>
<option>Fully</option>
<option>Partially</option>
<option>None</option>
</select>

</div>

</div>

<!-- Account -->

<div class="section">

<h2>10. Account Credential</h2>

<input type="hidden" name="email" value="{{email}}">

<input type="password" name="password" placeholder="Create Password (min 8 characters, 1 letter, 1 number)" required>

</div>

<div class="section">

<label>
<input type="checkbox" required>
I agree to share my health data for medical analysis
</label>

</div>

<div class="buttons">

<button type="submit">Submit Application</button>

<button type="reset">Reset</button>

</div>

</form>

</div>

</body>
</html>
