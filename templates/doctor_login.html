<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login – HealthPulse</title>

    <link rel="stylesheet" href="/static/doctor.css">
</head>

<body>

    <!-- Back Link -->
    <div class="back">
        <a href="/">← Back to Home</a>
    </div>

    <!-- Login Card -->
    <div class="login-container">

        <h2 class="logo">⚕ HealthPulse</h2>

        <div class="icon">🩺</div>

        <h1>Doctor Login</h1>
        <p>Enter your credentials to access the doctor dashboard</p>

        <form method="POST" action="/doctor-login">

            <label>Doctor ID</label>
            <input type="text" name="username" placeholder="Enter doctor ID" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="demo">
            Demo Credentials <br>
            <strong>doctor / doctor123</strong>
        </div>

    </div>

</body>
</html>
